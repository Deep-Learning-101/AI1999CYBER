<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Learning 101 看板</title>
<style>
  /* 嵌入式小工具樣式（可直接 iframe 放入 GitHub Pages） */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #374151;
    background: transparent;
    padding: 0 4px;
  }

  #widget-root { display: flex; flex-direction: column; gap: 10px; }

  .topic-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: box-shadow 0.15s;
  }
  .topic-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center;
    border-radius: 9999px; padding: 1px 8px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge-scheduled { background:#f3e8ff; color:#7c3aed; }
  .badge-approved  { background:#dcfce7; color:#15803d; }
  .badge-completed { background:#d1fae5; color:#065f46; }

  .nickname { font-size: 11px; color: #9ca3af; }

  .title { font-size: 13px; font-weight: 600; color: #111827; line-height: 1.4; }

  .summary { font-size: 12px; color: #6b7280; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    border-radius: 9999px; padding: 1px 7px;
    font-size: 10px; font-weight: 500;
    background: #eff6ff; color: #2563eb;
  }

  .meeting-info {
    font-size: 11px; color: #6b7280;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .meeting-info a { color: #6366f1; text-decoration: none; }
  .meeting-info a:hover { text-decoration: underline; }

  .footer {
    text-align: center; font-size: 11px; color: #9ca3af; padding: 6px 0 2px;
  }
  .footer a { color: #6366f1; text-decoration: none; }

  .empty, .loading, .error-msg {
    text-align: center; color: #9ca3af; padding: 20px 0; font-size: 12px;
  }
  .error-msg { color: #ef4444; }
</style>
</head>
<body>
<div id="widget-root"><div class="loading">載入中…</div></div>

<script>
// 替換成你的部署網址（HF Spaces 或 Cloud Run）
var API_BASE = (function () {
  var params = new URLSearchParams(window.location.search)
  return params.get('api') || 'https://YOUR_APP_URL'
})()

var STATUS_LABEL = {
  APPROVED:  '已核准',
  SCHEDULED: '已排程',
  COMPLETED: '已完成',
}
var STATUS_CLASS = {
  APPROVED:  'badge-approved',
  SCHEDULED: 'badge-scheduled',
  COMPLETED: 'badge-completed',
}

function formatDate(iso) {
  if (!iso) return ''
  var d = new Date(iso)
  return d.toLocaleDateString('zh-TW', {
    timeZone: 'Asia/Taipei',
    year: 'numeric', month: 'long', day: 'numeric',
    weekday: 'short',
  })
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function renderCard(topic) {
  var dateHtml = topic.meetingDate
    ? '<span>📅 ' + escHtml(formatDate(topic.meetingDate)) + '</span>'
    : ''
  var linkHtml = (topic.isPublic && topic.meetingUrl)
    ? '<a href="' + escHtml(topic.meetingUrl) + '" target="_blank" rel="noopener">🔗 加入聚會</a>'
    : (topic.isPublic ? '' : '<span>🔒 私人聚會</span>')
  var recHtml  = (topic.allowRecording && topic.meetingUrl)
    ? '<span>📹 可錄影回放</span>' : ''

  var meetingRow = (dateHtml || linkHtml || recHtml)
    ? '<div class="meeting-info">' + [dateHtml, linkHtml, recHtml].filter(Boolean).join('') + '</div>'
    : ''

  var tagsHtml = topic.tags && topic.tags.length
    ? '<div class="tags">' + topic.tags.map(function(t){ return '<span class="tag">' + escHtml(t) + '</span>' }).join('') + '</div>'
    : ''

  return '<div class="topic-card">' +
    '<div class="card-header">' +
      '<span class="badge ' + STATUS_CLASS[topic.status] + '">' + escHtml(STATUS_LABEL[topic.status] || topic.status) + '</span>' +
      '<span class="nickname">' + escHtml(topic.nickname || '') + '</span>' +
    '</div>' +
    '<div class="title">' + escHtml(topic.title) + '</div>' +
    '<div class="summary">' + escHtml(topic.summary || '') + '</div>' +
    tagsHtml + meetingRow +
  '</div>'
}

function render(topics) {
  var root = document.getElementById('widget-root')
  if (!topics || !topics.length) {
    root.innerHTML = '<div class="empty">目前尚無已排定的聚會</div>'
    return
  }
  var html = topics.map(renderCard).join('')
  html += '<div class="footer"><a href="https://deep-learning-101.github.io/" target="_blank" rel="noopener">Deep Learning 101</a> · 更多議題與申請</div>'
  root.innerHTML = html
}

fetch(API_BASE + '/api/topics/public')
  .then(function(r){ return r.json() })
  .then(function(json){
    if (json.success) render(json.data)
    else document.getElementById('widget-root').innerHTML = '<div class="error-msg">載入失敗：' + escHtml(json.error || '未知錯誤') + '</div>'
  })
  .catch(function(err){
    document.getElementById('widget-root').innerHTML = '<div class="error-msg">無法連線至 API</div>'
  })
</script>
</body>
</html>
